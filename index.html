<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cash Flow Pod Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#15181d; --muted:#6a717d; --line:#e4e7ec; --soft:#f0f2f5;
  --accent:#2f5bd3; --accentink:#ffffff; --ok:#1f8a5b; --okbg:#e5f5ed; --warn:#b26a00; --warnbg:#fff3df;
  --bad:#c0362c; --badbg:#fde9e7; --info:#2f5bd3; --infobg:#e8eefc; --shadow:0 10px 30px rgba(15,20,30,.12);
  --s0:#8a63d2; --s1:#2f5bd3; --s2:#0f8fa3; --s3:#d08a00; --s4:#d3602f; --s5:#1f8a5b;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --card:#171a20; --ink:#e9ecf1; --muted:#9aa2ae; --line:#272b33; --soft:#1e222a;
    --accent:#7d9cf0; --accentink:#0f1115; --ok:#4cc38a; --okbg:#143023; --warn:#f0b04a; --warnbg:#33260f;
    --bad:#f07468; --badbg:#3a1714; --info:#7d9cf0; --infobg:#1a2440; --shadow:0 10px 30px rgba(0,0,0,.5);
    --s0:#a98ae6; --s1:#7d9cf0; --s2:#3fc1d3; --s3:#f0b04a; --s4:#f08a5d; --s5:#4cc38a;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:28px 16px 60px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{margin:0;font-size:24px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accentink)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.banner{display:none;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px;font-weight:500}
.banner.show{display:flex}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:90vw}
.toast.show{opacity:1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{color:var(--muted);font-size:12px;font-weight:500}
.kpi .v{font-size:28px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi.alert .v{color:var(--bad)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
.panel h2{font-size:14px;margin:0;font-weight:600}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tabs{display:inline-flex;background:var(--soft);border-radius:8px;padding:3px}
.tab{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:500;padding:5px 12px;border-radius:6px;cursor:pointer}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.flabel{color:var(--muted);font-size:12px;margin-right:2px}
.board{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--soft);border-radius:10px;padding:8px;min-height:160px;display:flex;flex-direction:column;gap:8px;transition:outline .1s}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.colh{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 4px 2px}
.colh .n{margin-left:auto;color:var(--muted);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.kc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:grab;user-select:none}
.kc:hover{border-color:var(--muted)}
.kc.dragging{opacity:.4}
.kc.dropbefore{box-shadow:0 -3px 0 var(--accent)}
.kc .cname{font-size:13px}
.kc .status{font-size:12px}
.kc .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.cname{font-weight:600}
.status{color:var(--muted);font-size:13px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--soft);white-space:nowrap}
.owner{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.av{width:22px;height:22px;border-radius:50%;background:var(--infobg);color:var(--info);font-size:10px;font-weight:700;display:grid;place-items:center;flex:none}
.none{color:var(--muted);font-style:italic}
.due{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;display:inline-block}
.due.over{background:var(--badbg);color:var(--bad)} .due.today{background:var(--warnbg);color:var(--warn)}
.due.soon{background:var(--infobg);color:var(--info)} .due.later{background:var(--soft);color:var(--muted)}
.nx{font-size:12px;margin-top:6px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--soft)}
select.inline{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:4px 6px}
.team{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.member{border:1px solid var(--line);border-radius:10px;padding:12px}
.member .h{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:8px}
.member .r{font-size:11px;color:var(--muted);font-weight:500}
.member ul{margin:0;padding:0;list-style:none;font-size:13px}
.member li{padding:3px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.err{background:var(--badbg);color:var(--bad);padding:12px;border-radius:10px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,12,16,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:40;overflow:auto}
.ov.show{display:flex}
.modal{background:var(--card);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:560px;padding:20px}
.modal h3{margin:0 0 14px;font-size:17px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px}
.f.full{grid-column:1/-1}
.f label{font-size:12px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 10px;width:100%}
.f textarea{resize:vertical;min-height:60px}
.mf{display:flex;justify-content:space-between;gap:8px;margin-top:18px;flex-wrap:wrap}
.mf .r{display:flex;gap:8px}
.log{margin:0;padding:0;list-style:none}
.log li{display:flex;gap:12px;padding:5px 0;font-size:13px;border-bottom:1px solid var(--line);align-items:flex-start}
.log li:last-child{border-bottom:0}
.log .d{color:var(--muted);min-width:84px;font-variant-numeric:tabular-nums}
.log .t{flex:1}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 4px}
.addnote{display:grid;grid-template-columns:140px 1fr auto;gap:8px;margin-top:8px}
.help{font-size:12px;color:var(--muted);margin-top:6px}
#print{display:none}
@media (max-width:820px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .team{grid-template-columns:repeat(2,1fr)}
  .fg{grid-template-columns:1fr}
  .addnote{grid-template-columns:1fr}
  .hide-m{display:none}
}
/* print */
@media print{
  @page{size:letter landscape;margin:12mm}
  :root{--bg:#fff;--card:#fff;--ink:#111;--muted:#555;--line:#d6d9de;--soft:#f1f3f5}
  body{background:#fff;font-size:11px}
  .wrap,.ov,.toast{display:none!important}
  #print{display:block}
  #print h1{font-size:18px}
  #print .meta{color:#555;margin:2px 0 12px}
  #print .sum{display:flex;gap:24px;margin-bottom:12px;font-size:12px}
  #print .sum b{font-size:16px;display:block}
  #print table{font-size:11px}
  #print th{color:#555;border-bottom:1.5px solid #111;padding:6px}
  #print td{padding:6px;border-bottom:1px solid #d6d9de}
  #print tr{page-break-inside:avoid}
  #print .g td{background:#f1f3f5;font-weight:700;padding-top:8px}
  #print ul{margin:0;padding-left:14px}
  .pill,.due{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Cash Flow Pod Tracker</h1>
      <div class="sub" id="sub">Loading…</div>
    </div>
    <div class="actions">
      <button class="btn" id="bAdd">+ Add client</button>
      <button class="btn" id="bPrint">Print / PDF</button>
      <button class="btn" id="bSettings" title="GitHub connection">Settings</button>
      <button class="btn primary" id="bSave" disabled>Save changes</button>
    </div>
  </header>
  <div class="banner" id="banner"><span id="bannerTxt"></span><span class="actions"><button class="btn" id="bDownload">Download data.json</button><button class="btn danger" id="bDiscard">Discard changes</button></span></div>
  <div id="app"></div>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div id="print"></div>

<script>
const STAGE_COLORS=['--s0','--s1','--s2','--s3','--s4','--s5'];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const LEGACY={'En progreso':'In progress','Draft enviado':'Draft sent','Meeting agendada':'Meeting scheduled','Implementado':'Implemented'};
const LS_KEY='cfpod_tracker_local', LS_GH='cfpod_tracker_github', LS_VIEW='cfpod_tracker_view';
const state={owner:'All', view:'board', dragIdx:null};
let DATA=null, dirty=false;

/* storage helpers */
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}

/* dates */
function parseDate(s){if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function today(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function fmt(s){const d=parseDate(s);return d?`${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`:''}
function dueInfo(s){
  const d=parseDate(s);if(!d)return null;
  const diff=Math.round((d-today())/86400000);
  if(diff<0)return{cls:'over',txt:`Overdue ${-diff} day${diff===-1?'':'s'}`};
  if(diff===0)return{cls:'today',txt:'Today'};
  if(diff===1)return{cls:'soon',txt:'Tomorrow'};
  return{cls:diff<=7?'soon':'later',txt:`In ${diff} days`};
}

/* render helpers */
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function color(stage){const i=DATA.stages.indexOf(stage);return `var(${STAGE_COLORS[i<0?0:i%6]})`}
function initials(n){return n.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase()}
function ownerHtml(o){return o?`<span class="owner"><span class="av">${esc(initials(o))}</span>${esc(o)}</span>`:`<span class="owner none">Unassigned</span>`}
function stagePill(s){return `<span class="pill"><span class="dot" style="background:${color(s)}"></span>${esc(s)}</span>`}
function dueHtml(c){const di=dueInfo(c.nextDate);return di?`<span class="due ${di.cls}">${di.txt}</span>`:''}
function nextText(c){return c.nextAction||c.nextDate?`${esc(c.nextAction||'Next step')}${c.nextDate?` · ${fmt(c.nextDate)}`:''}`:''}
function sortedNotes(c){return [...(c.notes||[])].sort((a,b)=>b.date.localeCompare(a.date))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2800)}

function normalize(d){
  d.stages=(d.stages||[]).map(s=>LEGACY[s]||s);
  d.clients.forEach(c=>{c.stage=LEGACY[c.stage]||c.stage;if(!d.stages.includes(c.stage))c.stage=d.stages[0];c.notes=c.notes||[]});
  return d;
}

/* changes */
function markDirty(){dirty=true;DATA.updated=iso(today());lsSet(LS_KEY,{data:DATA,dirty:true});render()}
function moveClient(idx,stage,beforeIdx){
  const c=DATA.clients[idx];
  const changed=c.stage!==stage;
  DATA.clients.splice(idx,1);
  let to=beforeIdx==null?DATA.clients.length:(beforeIdx>idx?beforeIdx-1:beforeIdx);
  DATA.clients.splice(to,0,c);
  if(changed){c.stage=stage;c.notes.push({date:iso(today()),text:`Stage changed to ${stage}`})}
  markDirty();
}

function visible(){
  return DATA.clients.map((c,i)=>({c,i})).filter(({c})=>{
    if(state.owner==='All')return true;
    if(state.owner==='Unassigned')return !c.owner;
    return c.owner===state.owner;
  });
}

function render(){
  const C=DATA.clients;
  const done=C.filter(c=>c.stage==='Implemented').length;
  const due=C.filter(c=>{const d=dueInfo(c.nextDate);return d&&(d.cls==='over'||d.cls==='today')}).length;
  const unassigned=C.filter(c=>!c.owner).length;
  const owners=['All',...DATA.team.map(t=>t.name),'Unassigned'];
  const list=visible();

  document.getElementById('sub').textContent=`Last updated ${fmt(DATA.updated)} · Today ${fmt(iso(today()))}`;
  document.getElementById('bSave').disabled=!dirty;
  document.getElementById('banner').classList.toggle('show',dirty);
  document.getElementById('bannerTxt').textContent='You have unsaved changes. They only live in this browser until you press Save changes.';

  let body='';
  if(state.view==='board'){
    body=`<div class="board">${DATA.stages.map(s=>{
      const cs=list.filter(x=>x.c.stage===s);
      return `<div class="col" data-stage="${esc(s)}"><div class="colh"><span class="dot" style="background:${color(s)}"></span>${esc(s)}<span class="n">${cs.length}</span></div>
      ${cs.map(({c,i})=>`<div class="kc" draggable="true" data-idx="${i}">
        <div class="cname">${esc(c.name)}</div><div class="status">${esc(c.status)}</div>
        ${nextText(c)?`<div class="nx">${nextText(c)}</div>`:''}
        <div class="meta">${ownerHtml(c.owner)}${dueHtml(c)}</div></div>`).join('')}</div>`;
    }).join('')}</div><div class="help">Drag a card to another column to change its stage, or drop it on another card to reorder. Click a card to edit it.</div>`;
  }else{
    const rows=[...list].sort((a,b)=>DATA.stages.indexOf(a.c.stage)-DATA.stages.indexOf(b.c.stage)).map(({c,i})=>{
      const ln=sortedNotes(c)[0];
      return `<tr class="row" data-edit="${i}">
        <td><div class="cname">${esc(c.name)}</div><div class="status">${esc(c.status)}</div></td>
        <td><select class="inline" data-stagesel="${i}">${DATA.stages.map(s=>`<option ${s===c.stage?'selected':''}>${esc(s)}</option>`).join('')}</select></td>
        <td>${ownerHtml(c.owner)}</td>
        <td>${nextText(c)||'<span class="none">Not set</span>'}<div>${dueHtml(c)}</div></td>
        <td class="hide-m" style="color:var(--muted);font-size:13px">${ln?`${fmt(ln.date)}<br>${esc(ln.text)}`:''}</td></tr>`;
    }).join('');
    body=`<div style="overflow-x:auto"><table><thead><tr><th>Client</th><th>Stage</th><th>Owner</th><th>Next action</th><th class="hide-m">Latest note</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="none">No clients match this filter</td></tr>'}</tbody></table></div>`;
  }

  const team=DATA.team.map(t=>{
    const cs=C.filter(c=>c.owner===t.name);
    return `<div class="member"><div class="h"><span class="av">${esc(initials(t.name))}</span>${esc(t.name)} <span class="r">${esc(t.role||'')}</span></div>
      <ul>${cs.length?cs.map(c=>`<li><span>${esc(c.name)}</span>${stagePill(c.stage)}</li>`).join(''):'<li class="none">No clients assigned</li>'}</ul></div>`;
  }).join('');

  document.getElementById('app').innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="l">Clients</div><div class="v">${C.length}</div></div>
      <div class="kpi"><div class="l">Implemented</div><div class="v">${done}</div></div>
      <div class="kpi ${due?'alert':''}"><div class="l">Actions due today or overdue</div><div class="v">${due}</div></div>
      <div class="kpi"><div class="l">Unassigned</div><div class="v">${unassigned}</div></div>
    </div>
    <div class="panel">
      <div class="ph"><h2>Clients</h2><div class="tabs"><button class="tab ${state.view==='board'?'on':''}" data-view="board">Board</button><button class="tab ${state.view==='list'?'on':''}" data-view="list">List</button></div></div>
      <div class="filters"><span class="flabel">Owner</span>${owners.map(o=>`<button class="chip ${state.owner===o?'on':''}" data-owner="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      ${body}
    </div>
    <div class="panel"><div class="ph"><h2>Team</h2></div><div class="team">${team}</div></div>`;

  bind();
  renderPrint();
}

function bind(){
  document.querySelectorAll('[data-owner]').forEach(b=>b.onclick=()=>{state.owner=b.dataset.owner;render()});
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;lsSet(LS_VIEW,state.view);render()});
  document.querySelectorAll('[data-edit]').forEach(r=>r.onclick=e=>{if(e.target.tagName!=='SELECT')openEditor(+r.dataset.edit)});
  document.querySelectorAll('[data-stagesel]').forEach(s=>{s.onclick=e=>e.stopPropagation();s.onchange=()=>{const i=+s.dataset.stagesel;moveClient(i,s.value,i)}});
  document.querySelectorAll('.kc').forEach(k=>{
    k.onclick=()=>openEditor(+k.dataset.idx);
    k.ondragstart=e=>{state.dragIdx=+k.dataset.idx;k.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',k.dataset.idx)};
    k.ondragend=()=>{k.classList.remove('dragging');document.querySelectorAll('.dropbefore,.over').forEach(x=>x.classList.remove('dropbefore','over'))};
    k.ondragover=e=>{e.preventDefault();document.querySelectorAll('.dropbefore').forEach(x=>x.classList.remove('dropbefore'));if(+k.dataset.idx!==state.dragIdx)k.classList.add('dropbefore')};
    k.ondrop=e=>{e.preventDefault();e.stopPropagation();const to=+k.dataset.idx;if(state.dragIdx==null||to===state.dragIdx)return;moveClient(state.dragIdx,k.closest('.col').dataset.stage,to);state.dragIdx=null};
  });
  document.querySelectorAll('.col').forEach(col=>{
    col.ondragover=e=>{e.preventDefault();col.classList.add('over')};
    col.ondragleave=e=>{if(!col.contains(e.relatedTarget))col.classList.remove('over')};
    col.ondrop=e=>{e.preventDefault();col.classList.remove('over');if(state.dragIdx==null)return;moveClient(state.dragIdx,col.dataset.stage,null);state.dragIdx=null};
  });
}

/* editor */
let editIdx=null, draftNotes=[];
function openEditor(idx){
  editIdx=idx;
  const isNew=idx==null;
  const c=isNew?{name:'',owner:'',stage:DATA.stages[0],status:'',nextAction:'',nextDate:'',notes:[]}:DATA.clients[idx];
  draftNotes=JSON.parse(JSON.stringify(c.notes||[]));
  const m=document.getElementById('modal');
  m.innerHTML=`<h3>${isNew?'Add client':'Edit client'}</h3>
    <div class="fg">
      <div class="f full"><label>Client name</label><input id="eName" value="${esc(c.name)}"></div>
      <div class="f"><label>Stage</label><select id="eStage">${DATA.stages.map(s=>`<option ${s===c.stage?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
      <div class="f"><label>Owner</label><select id="eOwner"><option value="">Unassigned</option>${DATA.team.map(t=>`<option ${t.name===c.owner?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
      <div class="f full"><label>Current status</label><input id="eStatus" value="${esc(c.status)}" placeholder="Short line shown under the client name"></div>
      <div class="f"><label>Next action</label><input id="eNext" value="${esc(c.nextAction)}" placeholder="Follow up, Meeting…"></div>
      <div class="f"><label>Next action date</label><input id="eDate" type="date" value="${esc(c.nextDate)}"></div>
      <div class="f full"><label>Notes history</label><ul class="log" id="eNotes"></ul>
        <div class="addnote"><input id="nDate" type="date" value="${iso(today())}"><input id="nText" placeholder="Add a note"><button class="btn" id="nAdd">Add</button></div></div>
    </div>
    <div class="mf"><div>${isNew?'':'<button class="btn danger" id="eDel">Delete client</button>'}</div>
      <div class="r"><button class="btn" id="eCancel">Cancel</button><button class="btn primary" id="eOk">${isNew?'Add':'Apply'}</button></div></div>`;
  drawNotes();
  document.getElementById('ov').classList.add('show');
  document.getElementById('eName').focus();
  document.getElementById('nAdd').onclick=addNote;
  document.getElementById('nText').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addNote()}};
  document.getElementById('eCancel').onclick=closeEditor;
  document.getElementById('eOk').onclick=applyEditor;
  if(!isNew)document.getElementById('eDel').onclick=()=>{if(confirm(`Delete ${c.name}?`)){DATA.clients.splice(idx,1);closeEditor();markDirty()}};
}
function drawNotes(){
  const ul=document.getElementById('eNotes');
  const ns=draftNotes.map((n,i)=>({n,i})).sort((a,b)=>b.n.date.localeCompare(a.n.date));
  ul.innerHTML=ns.length?ns.map(({n,i})=>`<li><span class="d">${fmt(n.date)}</span><span class="t">${esc(n.text)}</span><button class="x" data-del="${i}" title="Remove">×</button></li>`).join(''):'<li class="none">No notes yet</li>';
  ul.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{draftNotes.splice(+b.dataset.del,1);drawNotes()});
}
function addNote(){
  const t=document.getElementById('nText').value.trim(),d=document.getElementById('nDate').value||iso(today());
  if(!t)return;draftNotes.push({date:d,text:t});document.getElementById('nText').value='';drawNotes();
}
function applyEditor(){
  const name=document.getElementById('eName').value.trim();
  if(!name){toast('Client name is required');return}
  if(document.getElementById('nText').value.trim())addNote();
  const v={name,stage:document.getElementById('eStage').value,owner:document.getElementById('eOwner').value,
    status:document.getElementById('eStatus').value.trim(),nextAction:document.getElementById('eNext').value.trim(),
    nextDate:document.getElementById('eDate').value,notes:draftNotes};
  if(editIdx==null){DATA.clients.push(v)}
  else{const c=DATA.clients[editIdx];if(c.stage!==v.stage&&!v.notes.some(n=>n.text===`Stage changed to ${v.stage}`&&n.date===iso(today())))v.notes.push({date:iso(today()),text:`Stage changed to ${v.stage}`});Object.assign(c,v)}
  closeEditor();markDirty();
}
function closeEditor(){document.getElementById('ov').classList.remove('show');editIdx=null}
document.getElementById('ov').onclick=e=>{if(e.target.id==='ov')closeEditor()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEditor()});

/* print */
function renderPrint(){
  const C=DATA.clients;
  const due=C.filter(c=>{const d=dueInfo(c.nextDate);return d&&(d.cls==='over'||d.cls==='today')}).length;
  const groups=DATA.stages.map(s=>{
    const cs=C.filter(c=>c.stage===s);if(!cs.length)return '';
    return `<tr class="g"><td colspan="4">${esc(s)} (${cs.length})</td></tr>`+cs.map(c=>`<tr>
      <td><b>${esc(c.name)}</b><br>${esc(c.status)}</td><td>${esc(c.owner||'Unassigned')}</td>
      <td>${nextText(c)||'Not set'}${dueInfo(c.nextDate)?`<br>${dueInfo(c.nextDate).txt}`:''}</td>
      <td><ul>${sortedNotes(c).slice(0,3).map(n=>`<li>${fmt(n.date)}: ${esc(n.text)}</li>`).join('')}</ul></td></tr>`).join('');
  }).join('');
  document.getElementById('print').innerHTML=`<h1>Cash Flow Pod, Client Status Report</h1>
    <div class="meta">As of ${fmt(iso(today()))}</div>
    <div class="sum"><div><b>${C.length}</b>Clients</div><div><b>${C.filter(c=>c.stage==='Implemented').length}</b>Implemented</div><div><b>${due}</b>Actions due today or overdue</div><div><b>${C.filter(c=>!c.owner).length}</b>Unassigned</div></div>
    <table><thead><tr><th style="width:30%">Client</th><th style="width:12%">Owner</th><th style="width:20%">Next action</th><th>Recent notes</th></tr></thead><tbody>${groups}</tbody></table>`;
}
document.getElementById('bPrint').onclick=()=>{
  const t=document.title;document.title=`Cash Flow Pod Status ${iso(today())}`;
  window.print();setTimeout(()=>document.title=t,500);
};

/* GitHub save */
function repoGuess(){
  const h=location.hostname,p=location.pathname.split('/').filter(Boolean);
  if(h.endsWith('.github.io'))return{owner:h.split('.')[0],repo:p[0]||h};
  return{owner:'',repo:''};
}
function ghConf(){return Object.assign({branch:'main',path:'data.json',token:''},repoGuess(),lsGet(LS_GH)||{})}
function openSettings(){
  const g=ghConf();
  document.getElementById('modal').innerHTML=`<h3>GitHub connection</h3>
    <div class="fg">
      <div class="f"><label>Owner (user or organization)</label><input id="gOwner" value="${esc(g.owner)}"></div>
      <div class="f"><label>Repository</label><input id="gRepo" value="${esc(g.repo)}"></div>
      <div class="f"><label>Branch</label><input id="gBranch" value="${esc(g.branch)}"></div>
      <div class="f"><label>File</label><input id="gPath" value="${esc(g.path)}"></div>
      <div class="f full"><label>Personal access token</label><input id="gToken" type="password" value="${esc(g.token)}" placeholder="github_pat_…">
        <div class="help">Fine grained token with access to this repository only and Contents set to Read and write. It is stored only in this browser.</div></div>
    </div>
    <div class="mf"><div><button class="btn danger" id="gClear">Remove token</button></div><div class="r"><button class="btn" id="gCancel">Cancel</button><button class="btn primary" id="gOk">Save settings</button></div></div>`;
  document.getElementById('ov').classList.add('show');
  document.getElementById('gCancel').onclick=closeEditor;
  document.getElementById('gClear').onclick=()=>{const c=ghConf();c.token='';lsSet(LS_GH,c);closeEditor();toast('Token removed from this browser')};
  document.getElementById('gOk').onclick=()=>{
    lsSet(LS_GH,{owner:gOwner.value.trim(),repo:gRepo.value.trim(),branch:gBranch.value.trim()||'main',path:gPath.value.trim()||'data.json',token:gToken.value.trim()});
    closeEditor();toast('Settings saved');
  };
}
function b64(str){const bytes=new TextEncoder().encode(str);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)}
async function saveToGitHub(){
  const g=ghConf();
  if(!g.token||!g.owner||!g.repo){openSettings();toast('Add your GitHub token first, or use Download data.json');return}
  const btn=document.getElementById('bSave');btn.disabled=true;btn.textContent='Saving…';
  try{
    const url=`https://api.github.com/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}/contents/${g.path}`;
    const hdr={Authorization:`Bearer ${g.token}`,Accept:'application/vnd.github+json'};
    const cur=await fetch(`${url}?ref=${encodeURIComponent(g.branch)}&t=${Date.now()}`,{headers:hdr,cache:'no-store'});
    if(!cur.ok&&cur.status!==404)throw new Error(cur.status===401?'Token is not valid':`GitHub answered ${cur.status}`);
    const sha=cur.ok?(await cur.json()).sha:undefined;
    DATA.savedAt=new Date().toISOString();
    const res=await fetch(url,{method:'PUT',headers:hdr,body:JSON.stringify({message:`Update tracker ${iso(today())}`,content:b64(JSON.stringify(DATA,null,2)+'\n'),branch:g.branch,sha})});
    if(!res.ok){const j=await res.json().catch(()=>({}));throw new Error(j.message||`GitHub answered ${res.status}`)}
    dirty=false;lsSet(LS_KEY,{data:DATA,dirty:false});render();
    toast('Saved. The public link refreshes in about a minute.');
  }catch(e){toast('Could not save: '+e.message)}
  finally{btn.textContent='Save changes';btn.disabled=!dirty}
}
function download(){
  DATA.savedAt=new Date().toISOString();
  const blob=new Blob([JSON.stringify(DATA,null,2)+'\n'],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  lsSet(LS_KEY,{data:DATA,dirty:true});
  toast('Downloaded. Upload it to the repository to publish it.');
}

document.getElementById('bAdd').onclick=()=>openEditor(null);
document.getElementById('bSettings').onclick=openSettings;
document.getElementById('bSave').onclick=saveToGitHub;
document.getElementById('bDownload').onclick=download;
document.getElementById('bDiscard').onclick=()=>{if(confirm('Discard all unsaved changes?')){lsDel(LS_KEY);location.reload()}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

/* load */
const v=lsGet(LS_VIEW);if(v==='board'||v==='list')state.view=v;
fetch('data.json?v='+Date.now(),{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
  .then(remote=>{
    const local=lsGet(LS_KEY);
    if(local&&local.data&&(local.dirty||(local.data.savedAt||'')>(remote.savedAt||''))){DATA=normalize(local.data);dirty=!!local.dirty}
    else{DATA=normalize(remote);lsDel(LS_KEY)}
    render();
  })
  .catch(e=>{document.getElementById('sub').textContent='';document.getElementById('app').innerHTML=`<div class="err">Could not read data.json (${esc(e.message)}). Check that the file sits next to index.html and that the JSON has no formatting errors.</div>`});
</script>
</body>
</html>
